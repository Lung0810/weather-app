<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Weather App</h1>
        <p class="subtitle">
          Search any city and see current conditions plus the surrounding 48
          hours.
        </p>

        <form id="search-form">
          <input
            id="location-input"
            type="text"
            placeholder="Enter a city, postcode, or coordinates"
            aria-label="Location"
            required
          />
          <button type="submit">Search</button>
          <button type="button" id="locate-button" class="secondary">Use my location</button>
        </form>
      </header>

      <p id="status" class="status" role="status"></p>

      <section id="current-section" class="current hidden" aria-live="polite">
        <div class="current-main">
          <p id="place" class="place"></p>
          <p id="temperature" class="temperature"></p>
          <p id="condition" class="condition"></p>
          <div class="refresh-row">
            <button type="button" id="refresh-button" class="secondary">
              Refresh
            </button>
          </div>
        </div>

        <div class="current-details">
          <div class="detail">
            <span class="detail-label">Wind</span>
            <span id="wind" class="detail-value"></span>
          </div>
          <div class="detail">
            <span class="detail-label">Rain chance</span>
            <span id="rain" class="detail-value"></span>
          </div>
          <div class="detail">
            <span class="detail-label">Humidity</span>
            <span id="humidity" class="detail-value"></span>
          </div>
        </div>
      </section>

      <section id="daily-section" class="hidden">
        <div class="next-section">
          <h2>Next 7 days</h2>
          <div id="next-days" class="daily-row"></div>
        </div>
      </section>
      
    </div>
    <script src="script.js"></script>
  </body>
</html>
