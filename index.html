<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header>
            <h1>Weather App</h1>
            <p>Search any city to see cureent adn hour weather.</p>
        </header>

        <form class="search-form" id="search-form">
            <input type="text" id="loaction-input" placeholder="Enter a city, e.g.Hong Kong" autocomplete="off" required>
            <button type="submit">Search</button>
            <button type="button" id="refresh-button" class="secondary">Refresh</button>
        </form>

        <p id="status" class="status" role=status></p>

        <section id="current-weather" class="current-weather hidden">
            <div>
                <p id="location-name" class="location-name"></p>
                <p id="current-date" class="muted"></p>
            </div>

            <div class="current-main">
                <span id="current-icon" class="weather-icon"></span>
                <div>
                    <p id="current-temperature" class="temperature"></p>
                    <p id="current-condition" class="condition"></p>
                </div>
            </div>

            <div class="current-detail">
                <div class="detail">
                    <span class="detail-label">Wind</span>
                    <span id="wind" class="detail-value"></span>
                </div>
                <div class="detail">
                    <span class="detail-label">Rain Chance</span>
                    <span id="rain" class="detail-value"></span>
                </div>
                <div class="detail">
                    <span class="detail-label">Humidty</span>
                    <span id="humidity" class="detail-value"></span>
                </div>
            </div>
        </section>

        <section id="hourly-section" class="hidden">
            <div class="hour-section">
                <h2>Previous 24 hours</h2>
                <div id="previous-hour" class="hourly-row"></div>
            </div>

            <div class="hour-section">
                <h2>Next 24 hours</h2>
                <div id="next-hour" class="hourly-row"></div>
            </div>
        </section>
    </main>
</body>
</html>
